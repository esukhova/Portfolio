<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Екатерина Ухова</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png"/>
    <link rel="preload" imagesrcset="/images/intro-bg-d-1920.webp 1920w, /images/intro-bg-d-1920@2x.webp 3840w"
          as="image" type="image/webp" media="(min-width: 768px)">
    <link rel="preload" imagesrcset="/images/intro-bg-m-360.webp 360w, /images/intro-bg-m-360@2x.webp 720w" as="image"
          type="image/webp" media="(max-width: 767px)">
</head>
<body class="no-js">
<script>
    document.body.classList.remove('no-js');
    var i = new Image;
    i.onload = i.onerror = function () {
        document.body.classList.add(i.height == 1 ? "webp" : "no-webp")
    };
    i.src = "data:image/webp;base64,UklGRhoAAABXRUJQVlA4TA0AAAAvAAAAEAcQERGIiP4HAA==";
</script>
<div id="root">
</div>
<script type="module" src="/src/main.tsx"></script>
