name: Update project stats
on:
    schedule:
        # каждый понедельник в 06:00 UTC (09:00 МСК)
        -   cron: '0 6 * * 1'
    workflow_dispatch: # ручной запуск из вкладки Actions
permissions:
    contents: write
jobs:
    update-stats:
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: Set up Node
                uses: actions/setup-node@v4
                with:
                    node-version: 24
                    cache: npm
            -   name: Install dependencies
                run: npm ci
            -   name: Update stats from GitHub API
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: npm run stats:update
            -   name: Commit and push if changed
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add src/data/projects.json
                    git diff --staged --quiet || git commit -m "chore: update project language stats"
                    git push